[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gitmind-commit-model"
version = "0.1.0"
description = "A specialized machine learning model for Git commit message generation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

experiment = [
    "datasets>=5.0.1,<5.2.0",
    "huggingface-hub>=0.34.0,<1.0",
    "transformers==4.57.6",
    "tokenizers==0.22.2",
    "sentencepiece>=0.1.91,!=0.1.92",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["gitmind_commit_model*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
