# Initial experimental configuration.

model:
  pretrained_checkpoint: "Salesforce/codet5-small"
  architecture: "encoder-decoder"
  task: "conditional-text-generation"
  input_description: "Git diff"
  output_description: "Git commit message"

tokenization:
  source_max_length: 512
  target_max_length: 128
  truncation: false

chunking:
  strategy: "per_file_token_windows"
  overlap_tokens: 32
  supervision: "repeat_commit_message_per_chunk"
  experimental: true

generation:
  num_return_sequences: 3
  num_beams: 5
  max_new_tokens: 128
